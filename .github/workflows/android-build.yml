name: BeeTransceiver Android CI

on:
  push:
    branches: [main, feature-floor-updater-20261022]
    paths:
      - "android/**"
      - "windows/ptt_relay_api.py"
      - "tests/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android/**"
      - "windows/ptt_relay_api.py"
      - "tests/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: Test PTT floor control
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install "fastapi>=0.115,<1"
      - name: Validate Python and run floor regression tests
        run: |
          python -m py_compile windows/ptt_relay_api.py windows/ptt_pair_code.py
          python -m unittest discover -s tests -v
  android:
    name: Compile Android debug APK (testing only)
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Ensure Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile preview APK
        working-directory: android
        env:
          BEE_AUDIO_TOKEN: ""
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: BeeTransceiver-v0.8-preview-TEST
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: BeeTransceiver-v0.8-Windows-Update-Tools
          path: |
            tools/Apply_Floor_Control.cmd
            tools/Apply_Floor_Control.ps1
            tools/Setup_Signed_Updates.cmd
            tools/Setup_Signed_Updates.ps1
          if-no-files-found: error
          retention-days: 14
